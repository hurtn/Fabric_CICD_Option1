# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
      - 'dev'

variables:
- group: Fabric_Deployment_Group_S
- group: Fabric_Deployment_Group_NS

pool:
  name: Azure Pipelines


stages:
- stage: Test
  displayName: 'Deploy to Test'
  jobs:
    - deployment: 'DeployTest'
      displayName: 'Deploy to Test'
      environment: Test

      # Just to raise awareness that you can select pools at different stages
      # pool: 
      #   vmImage: 'windows-latest'

      strategy:
        runOnce:
          deploy:
            steps:
            - checkout: self
              path: 'self'

            - task: PowerShell@2
              inputs:
                targetType: 'inline'
                script: |
                  # Install Az module
                  Install-Module -Name Az -Force -Scope CurrentUser

                  # Import Az module
                  Import-Module Az

                  # Run your script
                  .\scripts\updatefromgit.ps1 -workspaceName $(testWorkspaceName) -pFabricToken $(fabrictoken)

